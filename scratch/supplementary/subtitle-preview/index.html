<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>AlphaNIST · subtitle preview</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f0eb; color: #41443f; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(1440px, calc(100% - 40px)); margin: 32px auto 64px; }
    a { color: inherit; text-underline-offset: 4px; }
    h1 { margin: 24px 0 8px; font-size: 26px; font-weight: 400; }
    p { margin: 0 0 28px; }
    figure { margin: 0 0 36px; }
    img { display: block; width: 100%; height: auto; }
    figcaption { margin-top: 10px; font-size: 14px; }
    a:focus-visible { outline: 2px solid #80772e; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a href="../">← Back to the film</a>
    <h1>Subtitle preview</h1>
    <p>Muted charcoal text. No outline, shadow, or box. The live film is unchanged.</p>
    <figure>
      <a href="charcoal-footage.png"><img src="charcoal-footage.png" width="1920" height="1080" alt="Two robot close-ups with smaller charcoal subtitles beneath them."></a>
      <figcaption>Close-up footage · click to inspect at full size</figcaption>
    </figure>
    <figure>
      <a href="charcoal-full-frame.png"><img src="charcoal-full-frame.png" width="1920" height="1080" alt="Full-frame robot footage with charcoal subtitles over the gray studio floor." loading="lazy"></a>
      <figcaption>Full-frame footage</figcaption>
    </figure>
    <figure>
      <a href="charcoal-slide.png"><img src="charcoal-slide.png" width="1920" height="1080" alt="Conclusion slide with charcoal subtitles on its light background." loading="lazy"></a>
      <figcaption>Conclusion slide</figcaption>
    </figure>
  </main>
</body>
</html>

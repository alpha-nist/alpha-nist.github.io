<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title description">
  <title id="title">Single-component assembly: evaluated success across parallel training scales</title>
  <desc id="description">Three training conditions, each measured at all nine scales from 1,024 to 262,144 parallel environments. Binary reward with beta sampling rises from 38.55 to 97.37 percent; binary reward with uniform sampling rises from 34.87 to 84.28 percent, including an observed dip at 65,536; dense reward with beta sampling rises from 11.91 to 77.43 percent. Points are means of five evaluation seeds, not independent training replicates. All checkpoints are at 25,000 training iterations. Evaluation covers 19 tasks, excluding M4 nut threading, on the same frozen mixed-reset bank including partial assemblies. Compute increases with scale. Connecting lines do not represent additional observations.</desc>
  <rect width="900" height="520" fill="#fff"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#33372f">
    <text x="100" y="31" font-size="22">Evaluated success (%)</text>
    <g font-size="18">
      <path d="M100 64h34" stroke="#546540" stroke-width="3"/>
      <circle cx="117" cy="64" r="4.5" fill="#546540"/>
      <text x="145" y="70">Binary · beta sampling</text>
      <path d="M390 64h34" stroke="#8b8e81" stroke-width="3" stroke-dasharray="8 5"/>
      <circle cx="407" cy="64" r="4.5" fill="#fff" stroke="#8b8e81" stroke-width="2.5"/>
      <text x="435" y="70">Binary · uniform sampling</text>
      <path d="M697 64h30" stroke="#a47458" stroke-width="3" stroke-dasharray="3 5"/>
      <path d="m712 58 6 6-6 6-6-6z" fill="#a47458"/>
      <text x="738" y="70">Dense · beta</text>
    </g>
    <g stroke="#e8e9e3" stroke-width="1">
      <path d="M100 110H836M100 166H836M100 222H836M100 278H836M100 334H836M100 390H836"/>
    </g>
    <g font-size="18" text-anchor="end" fill="#686d62">
      <text x="79" y="116">100</text><text x="79" y="172">80</text>
      <text x="79" y="228">60</text><text x="79" y="284">40</text>
      <text x="79" y="340">20</text><text x="79" y="396">0</text>
    </g>
    <path d="M100 110V390H836" fill="none" stroke="#a5a99c" stroke-width="1.2"/>
    <g font-size="18" text-anchor="middle" fill="#686d62">
      <text x="100" y="423">1K</text><text x="192" y="423">2K</text>
      <text x="284" y="423">4K</text><text x="376" y="423">8K</text>
      <text x="468" y="423">16K</text><text x="560" y="423">32K</text>
      <text x="652" y="423">64K</text><text x="744" y="423">128K</text>
      <text x="836" y="423">256K</text>
    </g>
